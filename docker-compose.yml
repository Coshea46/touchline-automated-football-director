services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${MATCHPULSE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
      - "${MATCHPULSE_BIND_ADDRESS:-127.0.0.1}:8031:8031"
    init: true
    stop_grace_period: 30s
    environment:
      FOOTBALL_DATA_API_KEY: "${FOOTBALL_DATA_API_KEY:-}"
      GUARDIAN_API_KEY: "${GUARDIAN_API_KEY:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      MATCHPULSE_CAPTIONS_ENABLED: "${MATCHPULSE_CAPTIONS_ENABLED:-true}"
      MATCHPULSE_CAPTION_MAX_AUDIO_SECONDS: "${MATCHPULSE_CAPTION_MAX_AUDIO_SECONDS:-28800}"
      MATCHPULSE_CAPTION_BUDGET_USD: "${MATCHPULSE_CAPTION_BUDGET_USD:-3.60}"
      MATCHPULSE_API_ENABLED: "${MATCHPULSE_API_ENABLED:-true}"
      MATCHPULSE_API_HOST: "0.0.0.0"
      MATCHPULSE_API_PORT: "8031"
      MATCHPULSE_API_ALLOWED_ORIGINS: "${MATCHPULSE_API_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      MATCHPULSE_CAPTION_DIR: "/app/backend/artifacts/captions"
      MATCHPULSE_MONITOR: "${MATCHPULSE_MONITOR:-false}"
      MATCHPULSE_REPLAY_TRANSPORT: "${MATCHPULSE_REPLAY_TRANSPORT:-websocket}"
      MATCHPULSE_MODAL_WS_URL: "${MATCHPULSE_MODAL_WS_URL:-}"
      MATCHPULSE_MODAL_WS_TOKEN: "${MATCHPULSE_MODAL_WS_TOKEN:-}"
      MATCHPULSE_ML_MODE: "${MATCHPULSE_ML_MODE:-}"
      MATCHPULSE_ML_CHECKPOINT: "${MATCHPULSE_ML_CHECKPOINT:-}"
      MATCHPULSE_MODEL_VERSION: "${MATCHPULSE_MODEL_VERSION:-}"
      MATCHPULSE_DIRECTOR_MODE: "${MATCHPULSE_DIRECTOR_MODE:-balanced}"
      MATCHPULSE_DIRECTOR_EMERGENCY_ENABLED: "${MATCHPULSE_DIRECTOR_EMERGENCY_ENABLED:-false}"
      MATCHPULSE_DIRECTOR_EMERGENCY_MARGIN: "${MATCHPULSE_DIRECTOR_EMERGENCY_MARGIN:-0.50}"
      MATCHPULSE_SESSION_SECONDS: "${MATCHPULSE_SESSION_SECONDS:-300}"
      MATCHPULSE_SESSION_BUDGET_USD: "${MATCHPULSE_SESSION_BUDGET_USD:-1}"
      MATCHPULSE_MATCH_COUNT: "${MATCHPULSE_MATCH_COUNT:-7}"
      # Empty selects ceil(match_count / 2); explicit overrides permit 1..4 GPUs.
      MATCHPULSE_GPU_WORKERS: "${MATCHPULSE_GPU_WORKERS:-}"
      MATCHPULSE_SOURCES_JSON: "${MATCHPULSE_SOURCES_JSON:-}"
      MATCHPULSE_OFFSETS_JSON: "${MATCHPULSE_OFFSETS_JSON:-}"
      MATCHPULSE_SOURCE_ACCESS: "${MATCHPULSE_SOURCE_ACCESS:-public}"
      MATCHPULSE_SOURCE_URL_TTL: "${MATCHPULSE_SOURCE_URL_TTL:-3600}"
      MATCHPULSE_MOCK_SCORES_JSON: "${MATCHPULSE_MOCK_SCORES_JSON:-}"
      MATCHPULSE_ALLOWED_ORIGINS: "${MATCHPULSE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      S3_BUCKET_NAME: "${S3_BUCKET_NAME:-match-switcher-poc-videos}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      MODAL_TOKEN_ID: "${MODAL_TOKEN_ID:-}"
      MODAL_TOKEN_SECRET: "${MODAL_TOKEN_SECRET:-}"
    volumes:
      - ./backend/artifacts/captions:/app/backend/artifacts/captions:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_WS_URL: "${REACT_APP_WS_URL:-ws://localhost:8000}"
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:8031}"
    ports:
      - "${MATCHPULSE_BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      - backend
